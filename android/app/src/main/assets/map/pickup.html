<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#111214;font-family:Arial,sans-serif}#notice{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#A4A7AF;background:#111214;z-index:4;font-size:18px;padding:24px;text-align:center}.pin{display:grid;place-items:center;width:42px;height:42px;background:white;border:3px solid #1684ef;border-radius:50%;box-shadow:0 2px 7px #23324b44;pointer-events:none}.pin svg{width:26px;height:26px;fill:#1684ef}.recipient{width:40px;height:40px;background:#C8FF00;border:3px solid #111214}.recipient svg{fill:#111214;width:24px;height:24px}.recipient.last{background:#b56c17}.meeting{width:30px;height:30px;background:#111214;border:3px solid white}.meeting svg{width:18px;height:18px;fill:white}.car.last{border-color:#7b8b9f}.car.last svg{fill:#7b8b9f}
.car{width:48px;height:48px;border:2px solid #111214;background:#fff;position:relative}.car img{width:46px;height:34px;object-fit:contain}.car svg{width:28px;height:28px;fill:none;stroke:#111214;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}.car.last{border-color:#7b8b9f}.car.last img{opacity:.6}.car.last svg{fill:none;stroke:#7b8b9f}#route-label{position:absolute;right:12px;top:12px;z-index:4;padding:0;background:transparent;color:#303740;font-size:11px;font-weight:600;text-shadow:0 0 3px #fff,0 0 5px #fff;pointer-events:none}.recipient.manual{width:auto;height:auto;min-height:36px;padding:8px 13px;border:1px solid #C8FF00;border-radius:99px;background:#111214ef;color:#C8FF00;font-size:14px;font-weight:600;white-space:nowrap}
[hidden]{display:none!important}button{font:inherit;cursor:pointer}#map{position:absolute;left:0;top:0;width:100%;height:100%}.split-view #map{width:55%}.split-view #route-label{right:calc(45% + 12px)}#waiting-roadview{position:absolute;left:55%;top:0;bottom:0;right:0;z-index:5;background:#111214;border-left:2px solid #34373d}#roadview-photo{width:100%;height:100%}#roadview-status{position:absolute;inset:60px 24px 100px;display:grid;place-items:center;text-align:center;color:#dfe1e5;line-height:1.7;font-size:17px;background:#111214}#roadview-retry{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);border:1px solid #34373d;border-radius:12px;background:#1c1e22;color:#f4f5f7;min-height:44px;padding:10px 16px;font-size:15px;white-space:nowrap}#roadview-retry:disabled{opacity:.5}.roadview-waiting-pin{background:#111214ed;border:1px solid #c8ff00;color:#c8ff00;border-radius:30px;padding:10px 14px;font-size:15px;white-space:nowrap}

#map-controls{position:absolute;bottom:48px;left:16px;z-index:6;display:flex;flex-direction:column;gap:8px}#map-controls button{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:1px solid #ffffff66;background:#ffffff59;color:#20252d;font-size:25px;box-shadow:0 2px 8px #1112;backdrop-filter:blur(6px)}#map-controls button:active{background:#ffffffa6}#map-controls button:focus-visible{outline:2px solid #34373d;outline-offset:3px}#map-fit svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
#roadview-home{position:absolute;left:16px;top:16px;z-index:7;display:flex;align-items:center;gap:8px;padding:12px 16px;border:1px solid #34373d;border-radius:14px;min-height:48px;background:#1c1e22ed;color:#f4f5f7;font-size:15px;box-shadow:0 2px 8px #0002}#roadview-home svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}#roadview-home:focus-visible{outline:2px solid #a4a7af;outline-offset:3px}</style></head><body><div id="map" tabindex="0" aria-label="차량과 상대 위치 지도"></div><div id="notice" role="status">카카오 지도 연결 중…</div><span id="route-label" hidden>예상경로</span><div id="map-controls" role="group" aria-label="지도 조작" hidden><button id="map-zoom-in" aria-label="지도 확대">+</button><button id="map-zoom-out" aria-label="지도 축소">−</button><button id="map-fit" aria-label="전체 경로 보기"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M7 12h10m-5-5v10"/></svg></button></div><section id="waiting-roadview" aria-label="기다릴 위치 로드뷰" hidden><div id="roadview-photo" aria-label="카카오 로드뷰"></div><button id="roadview-home" aria-label="처음 위치로 돌아가기" hidden><svg viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 9M3 4v6h6"/></svg>처음 위치</button><p id="roadview-status" role="status"></p><button id="roadview-retry" hidden>다시 불러오기</button></section><script>__PMU_WAITING_ROADVIEW__</script><script>__PMU_MAP_CAMERA__</script><script>__PMU_MAP_ROUTE__</script><script>__PMU_MAP_VIEWPORT__</script><script>
(()=>{
 let maps,map,payload,overlays=[],loaded=false,loading=false,loadEpoch=0,retry=null;
 let viewport,routeLine,waitingRoadview,resizeFrame=0;
 const host=document.getElementById('map'),notice=document.getElementById('notice');
 function clear(){overlays.forEach(o=>o.setMap(null));overlays=[];}
 function point(p){return new maps.LatLng(p.latitude,p.longitude);}
 function pin(p,kind,last){
  if(!p)return;const node=document.createElement('div');node.className='pin '+kind+(last?' last':'');
  if(kind==='recipient'&&payload.manual){node.classList.add('manual');node.textContent='기다릴 위치';node.setAttribute('aria-label','상대가 직접 지정한 대기 위치');overlays.push(new maps.CustomOverlay({map,position:point(p),content:node,xAnchor:.5,yAnchor:1,zIndex:5}));return;}
  node.setAttribute('aria-label',kind==='car'?'차량':kind==='recipient'?(last?'상대 마지막 위치':'상대 위치'):'만날 곳');
  if(kind==='car'){const img=document.createElement('img');img.src='data:image/png;base64,__PMU_CAR_IMAGE__';img.alt='우리 차';node.append(img);}
  else {const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',kind==='car'?'m5 7 2-4h10l2 4M4 8h16a1 1 0 0 1 1 1v8H3V9a1 1 0 0 1 1-1ZM5 17v3m14-3v3M6 12h2m8 0h2':kind==='recipient'?'M12 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM5 22v-6a7 7 0 0 1 14 0v6Z':'M5 2h2v20H5ZM7 3h13l-4 5 4 5H7Z');svg.append(path);node.append(svg);}
  overlays.push(new maps.CustomOverlay({map,position:point(p),content:node,xAnchor:.5,yAnchor:.5,zIndex:kind==='recipient'?4:kind==='car'?3:2}));
 }
 function draw(){
  if(!maps||!map||!payload)return;clear();const p=payload;routeLine.update(p.route);
  if(!p.recipient)pin(p.destination,'meeting',false);pin(p.car,'car',!p.carFresh);pin(p.recipient,'recipient',!p.live&&!p.manual);viewport.update(p);document.getElementById('map-controls').hidden=!p.parked;
 }
 window.pickmeupMap={render(p){payload=p;waitingRoadview?.update(p);if(!p){clear();routeLine?.clear();viewport?.update(null);document.getElementById('map-controls').hidden=true;clearTimeout(retry);retry=null;return;}connect();draw();},resize(){cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{viewport?.resize();waitingRoadview?.resize();});}};
 new ResizeObserver(()=>window.pickmeupMap.resize()).observe(host);
 setInterval(()=>{if(payload)viewport?.fit();},1000);
 function connect(){
  if(loaded||loading||!payload)return;loading=true;const epoch=++loadEpoch;
  notice.style.display='flex';notice.textContent='카카오 지도 연결 중…';
  const script=document.createElement('script');
  function failed(){if(epoch!==loadEpoch||loaded||!payload)return;loading=false;clearTimeout(timeout);script.remove();notice.textContent='지도를 다시 연결하고 있어요';clearTimeout(retry);retry=setTimeout(connect,15000);}
  const timeout=setTimeout(failed,12000);
  script.src='https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey=__PMU_KAKAO_KEY__';
  script.onload=()=>{if(epoch!==loadEpoch||!payload)return;if(!window.kakao?.maps){failed();return;}window.kakao.maps.load(()=>{if(epoch!==loadEpoch||loaded||!payload)return;maps=window.kakao.maps;map=new maps.Map(host,{center:new maps.LatLng(37.4,127.1),level:3,draggable:false,scrollwheel:false,disableDoubleClickZoom:false,keyboardShortcuts:false});viewport=new PickupVehicleViewport(maps,map,host);routeLine=new PickupRouteLine(maps,map,document.getElementById('route-label'));
 maps.event.addListener(map,'dragstart',()=>viewport.interact());host.addEventListener('pointerdown',()=>viewport.interact(),{passive:true});host.addEventListener('wheel',()=>viewport.interact(),{passive:true});host.addEventListener('keydown',()=>viewport.interact());
 document.getElementById('map-zoom-in').onclick=()=>viewport.zoom(-1);document.getElementById('map-zoom-out').onclick=()=>viewport.zoom(1);document.getElementById('map-fit').onclick=()=>{if(payload?.parked)viewport.reset()};waitingRoadview=new PickupWaitingRoadview(maps,{split:value=>document.body.classList.toggle('split-view',value),retry:document.getElementById('roadview-retry'),home:document.getElementById('roadview-home'),pane:document.getElementById('waiting-roadview'),photo:document.getElementById('roadview-photo'),status:document.getElementById('roadview-status')});waitingRoadview.update(payload);loaded=true;loading=false;clearTimeout(timeout);clearTimeout(retry);notice.style.display='none';draw();});};
  script.onerror=failed;document.head.append(script);
 }
})();
</script></body></html>
